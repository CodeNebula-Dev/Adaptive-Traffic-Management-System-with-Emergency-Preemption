# ============================================================================
# ATMS-Net Phase 2 — Vehicle Detector Fine-Tuning Configuration
# ============================================================================
# This config fine-tunes the Phase 1 trained detector (best.pt) to:
#   1. Tighten bounding boxes (higher box_weight = 7.5)
#   2. Push confidence scores to 80%-95%+ (higher obj_weight = 2.0)
#   3. Polish feature boundaries using a calibrated lower learning rate
#
# Usage:
#   python scripts/train_detector.py \
#       --config configs/detector_finetune.yaml \
#       --finetune checkpoints/best.pt \
#       --device cuda
# ============================================================================

# --- Model Architecture ---
model:
  num_classes: 4              # car, motorcycle, bus, truck
  in_channels: 3              # RGB input
  depth_mul: 0.33             # Depth multiplier
  width_mul: 0.5              # Width multiplier
  img_size: 416               # Input resolution (square)

# --- Dataset ---
data:
  data_dir: "data/coco"                      # Root COCO directory
  train_list: "data/coco/train.txt"          # Training image list
  val_list: "data/coco/val.txt"              # Validation image list
  train_label_dir: "data/coco/labels/train2017" # Training labels
  val_label_dir: "data/coco/labels/train2017"   # Validation labels
  label_dir: "data/coco/labels/train2017"
  num_workers: 4

# --- Training (Fine-Tuning Specifics) ---
training:
  epochs: 50                  # 50 additional fine-tuning epochs (total 100)
  batch_size: 16              # Batch size per step
  accumulate_grad: 1

  # Optimizer: SGD with momentum
  optimizer: "sgd"
  learning_rate: 0.003        # Calibrated fine-tuning learning rate (preserves learned features)
  momentum: 0.937
  weight_decay: 0.0005

  # Learning rate schedule: Cosine Annealing fine-tuning
  scheduler: "cosine"
  warmup_epochs: 1            # Short 1-epoch warmup
  warmup_lr_ratio: 0.33       # Starts at 0.001 during warmup
  min_lr_ratio: 0.01          # Decays smoothly down to 0.00003

  # Mixed precision
  mixed_precision: true

  # EMA
  ema: true
  ema_decay: 0.9999

# --- Augmentation ---
augmentation:
  mosaic_prob: 0.3            # Slightly lower mosaic prob for fine-tuning stage
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  flip_prob: 0.5
  cutout_prob: 0.3

# --- Loss (Tuned for High Precision) ---
loss:
  box_weight: 7.5             # Boosted from 5.0 → 7.5 (forces tight bounding boxes)
  obj_weight: 2.0             # Boosted from 1.0 → 2.0 (forces objectness scores to 80-95%+)
  cls_weight: 1.0             # Stable classification loss

# --- Evaluation ---
evaluation:
  conf_threshold: 0.01        # Evaluation threshold for precision-recall curve
  iou_threshold: 0.45
  max_detections: 300
  val_interval: 1

# --- Checkpointing ---
checkpoint:
  save_dir: "checkpoints"
  save_interval: 10
  save_best: true

# --- Logging ---
logging:
  log_dir: "logs"
  log_interval: 50
  use_wandb: false
  project_name: "ATMS-Net"
  run_name: "phase2-finetuning"

# --- Device ---
device:
  preferred: "auto"
