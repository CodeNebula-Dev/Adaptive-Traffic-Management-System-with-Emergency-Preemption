# ============================================================================
# ATMS-Net Phase 2.5 — UA-DETRAC Traffic Surveillance 5-Class Configuration
# ============================================================================
# Fine-tunes pre-trained 40.5% mAP weights on overhead CCTV intersection data:
#   1. High Resolution (512x512) for distant queued vehicles & small motorcycles
#   2. 5-Class Support: [car, motorcycle, bus, truck, unknown_vehicle]
#   3. Hard-Negative Suppression (obj_weight = 2.5) to eliminate non-vehicle false alarms
#   4. Isolated Checkpoint Folder (checkpoints/uadetrac/)
# ============================================================================

# --- Model Architecture ---
model:
  num_classes: 5              # car, motorcycle, bus, truck, unknown_vehicle
  in_channels: 3              # RGB input
  depth_mul: 0.33             # Depth multiplier
  width_mul: 0.5              # Width multiplier
  img_size: 512               # High resolution (512x512) for surveillance

# --- Dataset ---
data:
  dataset_type: "uadetrac"                   # uadetrac or coco
  data_dir: "data/ua_detrac"                 # Root dataset directory
  train_list: "data/ua_detrac/train.txt"     # Training image list
  val_list: "data/ua_detrac/val.txt"         # Validation image list
  label_dir: "data/ua_detrac/labels"         # YOLO 5-class labels
  num_workers: 4

# --- Training Specifics ---
training:
  epochs: 40                  # 40 surveillance fine-tuning epochs
  batch_size: 16              # Batch size per step
  accumulate_grad: 1

  # Optimizer: SGD with momentum
  optimizer: "sgd"
  learning_rate: 0.002        # Gentle fine-tuning learning rate
  momentum: 0.937
  weight_decay: 0.0005

  # Learning rate schedule: Cosine Annealing
  scheduler: "cosine"
  warmup_epochs: 1            # 1-epoch warmup
  warmup_lr_ratio: 0.33
  min_lr_ratio: 0.01

  # Mixed precision
  mixed_precision: true

  # EMA
  ema: true
  ema_decay: 0.9999

# --- Augmentation ---
augmentation:
  mosaic_prob: 0.4            # 4-frame surveillance mosaic
  hsv_h: 0.015
  hsv_s: 0.6
  hsv_v: 0.4
  flip_prob: 0.5
  cutout_prob: 0.2

# --- Loss (Tuned for Dense Traffic & Hard-Negative Filtering) ---
loss:
  box_weight: 8.0             # Strict bounding box alignment
  obj_weight: 2.5             # Strong background suppression (eliminates false alarms)
  cls_weight: 1.0

# --- Evaluation ---
evaluation:
  conf_threshold: 0.01
  iou_threshold: 0.45
  max_detections: 300
  val_interval: 1

# --- Checkpointing (Isolated from COCO) ---
checkpoint:
  save_dir: "checkpoints/uadetrac"
  save_interval: 10
  save_best: true

# --- Logging ---
logging:
  log_dir: "logs/uadetrac"
  log_interval: 50
  use_wandb: false
  project_name: "ATMS-Net"
  run_name: "phase2.5-uadetrac-surveillance"

# --- Device ---
device:
  preferred: "auto"
